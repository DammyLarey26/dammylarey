<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <link rel="stylesheet" href="../css/actions.css">
  <link rel="stylesheet" href="../css/user.css">
  <link rel="stylesheet" href="../css/style.css">
  <link rel="stylesheet" href="../css/prof.css">
  
</head>
<body>
    
    <header class="user-header">
       <button class="menu-btn" id="menuBtn">☰</button>
        <div class="marquee">
            <marquee behavior="" direction="left">
                <h2>HISTORY</h2>
            </marquee>
        </div>
    </header>
    
    <div class="sidebar" id="sidebar">
    <button class="close-btn" id="closeBtn">&times;</button>
        <button class="backbtn" onclick="history.back()">&#8592</button>
        <div class="user-options">
            <div class="dash-logo">
            <img src="../images/download.png" alt="">
        </div>
            <a href="../index.html">Home</a>
			<a href="./profile.html">Profile</a>
			<a href="./dashboard.html">Dashboard</a>
        </div>
        <div class="right-handside">
            <i class="fa-solid fa-bell"></i>
            <i class="fa-solid fa-cog"></i>
        </div>
    </div>

    <main class="main-content">
        <div class="history-header">
           
            <p>View and manage all the items you have reported to the Lost & Found system.</p>
        </div>

        <div class="filters-row">
            <input type="text" id="searchBar" placeholder="Search by item name, location, or status...">
            <select id="statusFilter">
                <option value="all">All Status</option>
                <option value="pending">Pending</option>
                <option value="approved">Approved</option>
                <option value="rejected">Rejected</option>
            </select>
        </div>

        <div id="historyCardsContainer" class="history-cards-list">
            </div>
        <div class="prof-det">
            <div class="passport">
        <img id="img" src="../images/lekan.jpg" alt="">
      </div>
        <div class="prof-detname">
          <span  id="name">Loading...</span>
          <span id="userId">Loading...</span> 
        </div>
        
      </div>
    </main>
</div>


    <script type="module" src="../script/history.js"></script>




  <div class="bottom-nav">
    <a href="#" class="nav-item active">
      <i class="fa fa-home"></i>
      <span>Dashboard</span>
    </a>

    <a href="./view-lost.html" class="nav-item">
      <i class="fa fa-search"></i>
      <span>Lost</span>
    </a>

    <a href="./report.html" class="nav-item">
      <i class="fa fa-plus-circle"></i>
      <span>Report</span>
    </a>
    <a href="./view-found.html" class="nav-item ">
      <i class="fa fa-ellipsis-h"></i>
      <span>Found</span>
    </a>

  </div>
    </main>
    

    
  <script src="../script/faq.js"></script>
  <script src="../script/daschboard.js"></script>
  
  <script>
    const sidebar = document.getElementById("sidebar");
const menuBtn = document.getElementById("menuBtn");
const closeBtn = document.getElementById("closeBtn");

menuBtn.addEventListener("click", () => {
    sidebar.classList.add("active");
});

closeBtn.addEventListener("click", () => {
    sidebar.classList.remove("active");
});
  </script>
</body>

</html>
