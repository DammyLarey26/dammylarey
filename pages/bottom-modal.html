<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
<style>
    body {
  font-family: Arial;
  margin: 0;
}

/* Button */
.open-btn {
  margin: 100px;
  padding: 15px 25px;
  background: purple;
  color: white;
  border: none;
  border-radius: 10px;
}

/* Overlay */
.overlay {
  position: fixed;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  background: rgba(0,0,0,0.4);
  display: none;
}

/* Bottom Sheet */
.bottom-sheet {
  position: fixed;
  bottom: -100%;
  left: 0;
  width: 100%;
  background: #fff;
  border-radius: 20px 20px 0 0;
  padding: 20px;
  transition: 0.4s ease;
}

/* Active State */
.bottom-sheet.active {
  bottom: 0;
}

.overlay.active {
  display: block;
}

/* Header */
.sheet-header {
  display: flex;
  justify-content: space-between;
}

.close-btn {
  cursor: pointer;
  font-size: 24px;
}

</style>

<button onclick="openSheet()" class="open-btn">Pay Now</button>

<!-- Overlay -->
<div id="overlay" class="overlay" onclick="closeSheet()"></div>

<!-- Bottom Sheet -->
<div id="bottomSheet" class="bottom-sheet">
  <div class="sheet-header">
    <h2>Payment</h2>
    <span onclick="closeSheet()" class="close-btn">&times;</span>
  </div>

  <div class="sheet-content">
    <h1>₦538.00</h1>
    <p>Account Number: 9117515856</p>
    <p>Name: OLUWADAMILARE VICTOR ODUBELA</p>
    <button class="confirm-btn">Confirm to Pay</button>
  </div>
</div>

<script>
    function openSheet() {
  document.getElementById("bottomSheet").classList.add("active");
  document.getElementById("overlay").classList.add("active");
}

function closeSheet() {
  document.getElementById("bottomSheet").classList.remove("active");
  document.getElementById("overlay").classList.remove("active");
}
</script>
</body>
</html>
</body>
</html>
