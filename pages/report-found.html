<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Report Found</title>

    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/reg.css">
    <link rel="stylesheet" href="../css/upload.css">
    <link rel="stylesheet" href="../css/prof.css">
</head>

<body>
    <header class="user-header">
       <button class="menu-btn" id="menuBtn">☰</button>
        <div class="marquee">
            <marquee behavior="" direction="left">
                <h2>Report Found</h2>
            </marquee>
        </div>
    </header>

    <div class="sidebar" id="sidebar">
    <button class="close-btn" id="closeBtn">&times;</button>
        <button class="backbtn" onclick="history.back()">&#8592</button>
        <div class="user-options">
            <div class="dash-logo">
            <img src="../images/download.png" alt="">
        </div>
            <a href="../index.html">Home</a>
			<a href="./profile.html">Profile</a>
			<a class="active" href="">Dashboard</a>
			<a href="#" onclick="forceLogout(event)"><i class="fa-solid fa-arrow-right-from-bracket"></i> Logout</a>
        </div>
        <div class="right-handside">
            <i class="fa-solid fa-bell"></i>
            <i class="fa-solid fa-cog"></i>
        </div>
    </div>

    <main class="main-content">
    <section class="cont-reg">
        <div class="cont-main">
            <div class="header-cont">
                <h1>Report Found</h1>
            </div>

            <div class="body-cont">
                <div class="container">
                    <label for="itemName">Item name</label>
                    <input class="input-form" type="text" id="itemName" required>

                    <label for="itemCategory">Categories</label>
                    <select id="itemCategory" required>
                        <option value="">-- Select Category --</option>
                        <option value="electronics">Electronics</option>
                        <option value="books">Books</option>
                        <option value="card">Card</option>
                        <option value="accessories">Accessories</option>
                    </select>

                   <label for="dateFound">Date Found</label>
<input class="input-form" type="date" id="dateFound"> <!-- 🌟 Make sure id="dateFound" is present! -->

<!-- Check this input -->
<label for="locationFound">Location Found</label>
<input class="input-form" type="text" id="locationFound">
                </div>

                <div class="container">
                    <label for="itemDescription">Item Description</label>
                    <textarea placeholder="Describe unique features of the item" id="itemDescription"></textarea>
                    
                    <div class="upload-container">
                        <label for="fileInput" class="upload-box" id="uploadBox">
                            <input type="file" id="fileInput" accept="image/*" hidden>

                            <div class="upload-content" id="uploadContent">
                                <div class="plus">+</div>
                                <p class="title">File Upload</p>
                                <p class="subtitle">Upload Item Image</p>
                            </div>

                            <img id="previewImage" class="preview" alt="Preview Image" />
                        </label>
                    </div>
                </div>
            </div>

            <button id="submitFoundBtn" class="submit">Submit Found Report</button>
        </div>
    </section></main>
    <div class="prof-det">
        <div class="prof-detname">
          <span style="font-weight: bolder; font-size: large;" id="name">Loading...</span>
          <span id="userId">Loading...</span> 
        </div>
        <div class="passport">
        <img id="img" src="../images/lekan.jpg" alt="">
      </div>
      </div>

    <!-- Script Resource Configurations -->
    <script src="../script/c-reg.js"></script>
<script src="../script/upload.js"></script>
<script src="../script/reportFound.js"></script>
<script>
    const sidebar = document.getElementById("sidebar");
const menuBtn = document.getElementById("menuBtn");
const closeBtn = document.getElementById("closeBtn");

menuBtn.addEventListener("click", () => {
    sidebar.classList.add("active");
});

closeBtn.addEventListener("click", () => {
    sidebar.classList.remove("active");
});
  </script>
</body>

</html>
