<!DOCTYPE html>
<html lang="en">

<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Report Found</title>

	<link rel="stylesheet" href="../css/style.css">
	<link rel="stylesheet" href="../css/reg.css">
	<link rel="stylesheet" href="../css/upload.css">
</head>

<body>
	<header class="header">
		<button class="backbtn" onclick="history.back()">&#8592</button>
		<marquee behavior="" direction="left">
			<h2>OOU LOST & FOUND MANAGEMENT SYSTEM</h2>
		</marquee>
	</header>
	<section class="cont-reg">
		<div class="cont-main">
			<div class="header-cont">
				<h1>Report Found</h1>
			</div>

			<div class="body-cont">
				<div class="container">
					<label>
						Item name
						<input class="input-form" type="text" required>
					</label>

					<label>
						Categories
						<select required>
							<option value="">Electronics</option>
							<option value="">Books</option>
							<option value="">Card</option>
							<option value="">Accessories</option>
						</select>
					</label>

					<label>
						Date Found
						<input class="input-form" type="date">
					</label>

					<label>
						Location Found
						<input class="input-form" type="text">
					</label>
				</div>

				<div class="container">
					<label>
						Item Description
						<textarea name="" placeholder="Describe unique features of the item" id=""></textarea>
					</label>
					<div class="upload-container">
						<label for="fileInput" class="upload-box" id="uploadBox">
							<input type="file" id="fileInput" accept="image/*" hidden>

							<div class="upload-content" id="uploadContent">
								<div class="plus">+</div>
								<p class="title">File Upload</p>
								<p class="subtitle">Upload Item Image</p>
							</div>

							<img id="previewImage" class="preview" />
						</label>
					</div>
				</div>
			</div>

			<button class="submit">Submit Report</button>

		</div>
		<script src="../script/c-reg.js"></script>
		<script src="../script/upload.js"></script>
</body>

</html>
