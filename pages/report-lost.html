<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Report Lost</title>
  <link rel="stylesheet" href="../css/style.css">
  <link rel="stylesheet" href="../css/reg.css">
  <link rel="stylesheet" href="../css/upload.css">
  <link rel="stylesheet" href="../css/prof.css">
</head>

<body>
  <header class="user-header">
       <button class="menu-btn" id="menuBtn">☰</button>
        <div class="marquee">
            <marquee behavior="" direction="left">
                <h2>Report Lost</h2>
            </marquee>
        </div>
    </header>

    <div class="sidebar" id="sidebar">
    <button class="close-btn" id="closeBtn">&times;</button>
        <button class="backbtn" onclick="history.back()">&#8592</button>
        <div class="user-options">
            <div class="dash-logo">
            <img src="../images/download.png" alt="">
        </div>
            <a href="../index.html">Home</a>
			<a href="./profile.html">Profile</a>
			<a class="active" href="./dashboard.html">Dashboard</a>
			<a href="#" onclick="forceLogout(event)"><i class="fa-solid fa-arrow-right-from-bracket"></i> Logout</a>
        </div>
        <div class="right-handside">
            <i class="fa-solid fa-bell"></i>
            <i class="fa-solid fa-cog"></i>
        </div>
    </div>
    

    <main class="main-content">
      <section class="cont-reg">
    <div class="cont-main">
      <div class="header-cont">
        <h1>Report Item</h1>
      </div>

      <div class="body-cont">
        <div class="container">
          <label>
            Item name
            <input id="itemName" class="input-form" type="text" required>
          </label>

          <label>
            Categories
            <select id="itemCategory" required>
              <option value="" disabled selected>Select category</option>
              <option value="Electronics">Electronics</option>
              <option value="Books">Books</option>
              <option value="Card">Card</option>
              <option value="Accessories">Accessories</option>
            </select>
          </label>

          <label>
            Date 
            <input id="dateLost" class="input-form" type="date">
          </label>

          <label>
            Location 
            <input id="locationLost" class="input-form" type="text">
          </label>
        </div>

        <div class="container">
          <label>
            Item Description
            <input id="itemDescription" class="input-form" type="text">
          </label>

          <div class="upload-container">
            <label for="fileInput" class="upload-box" id="uploadBox">
              <input type="file" id="fileInput" accept="image/*" hidden>

              <div class="upload-content" id="uploadContent">
                <div class="plus">+</div>
                <p class="subtitle">Upload item's image</p>
              </div>

              <img id="previewImage" class="preview" style="display: none; max-width: 100%; height: auto;" />
            </label>
          </div>
        </div>
      </div>

      <button id="submitLostBtn" class="submit">Submit Report</button>

    </div>
</section>
    </main>
    <div class="prof-det">
            <div class="passport">
        <img id="img" src="../images/lekan.jpg" alt="">
      </div>
        <div class="prof-detname">
          <span  id="name">Loading...</span>
          <span id="userId">Loading...</span> 
        </div>

  
    <script src="../script/reportLost.js" type="module"></script>
    <script src="../script/dashboard.js"></script>
    <script>
    const sidebar = document.getElementById("sidebar");
const menuBtn = document.getElementById("menuBtn");
const closeBtn = document.getElementById("closeBtn");

menuBtn.addEventListener("click", () => {
    sidebar.classList.add("active");
});

closeBtn.addEventListener("click", () => {
    sidebar.classList.remove("active");
});
  </script>
</body>

</html>
