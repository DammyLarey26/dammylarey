<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Report Lost</title>
  <link rel="stylesheet" href="../css/style.css">
  <link rel="stylesheet" href="../css/reg.css">
  <link rel="stylesheet" href="../css/upload.css">
</head>

<body>
  <header class="header">
    <button class="backbtn" onclick="history.back()">&#8592</button>
    <marquee behavior="" direction="left">
      <h2>OOU LOST & FOUND MANAGEMENT SYSTEM</h2>
    </marquee>
  </header>

  <section class="cont-reg">
    <div class="cont-main">
      <div class="header-cont">
        <h1>Report Lost</h1>
      </div>

      <div class="body-cont">
        <div class="container">
          <label>
            Item name
            <input id="itemName" class="input-form" type="text" required>
          </label>

          <label>
            Categories
            <select id="itemCategory" required>
              <option value="" disabled selected>Select category</option>
              <option value="Electronics">Electronics</option>
              <option value="Books">Books</option>
              <option value="Card">Card</option>
              <option value="Accessories">Accessories</option>
            </select>
          </label>

          <label>
            Date Lost
            <input id="dateLost" class="input-form" type="date">
          </label>

          <label>
            Location Lost
            <input id="locationLost" class="input-form" type="text">
          </label>
        </div>

        <div class="container">
          <label>
            Item Description
            <input id="itemDescription" class="input-form" type="text">
          </label>

          <div class="upload-container">
            <label for="fileInput" class="upload-box" id="uploadBox">
              <input type="file" id="fileInput" accept="image/*" hidden>

              <div class="upload-content" id="uploadContent">
                <div class="plus">+</div>
                <p class="subtitle">Upload item's image</p>
              </div>

              <img id="previewImage" class="preview" style="display: none; max-width: 100%; height: auto;" />
            </label>
          </div>
        </div>
      </div>

      <button id="submitLostBtn" class="submit">Submit Lost Report</button>

    </div>
</section>
    <script src="../script/reportLost.js" type="module"></script>
</body>

</html>
