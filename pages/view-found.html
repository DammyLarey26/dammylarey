<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Found Items</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <link rel="stylesheet" href="../css/style.css">
  <link rel="stylesheet" href="../css/user.css">
  <link rel="stylesheet" href="../css/view.css">
  <link rel="stylesheet" href="../css/bottommodal.css">
</head>

<body>

  <header class="header">
    <button class="backbtn" onclick="history.back()">&#8592</button>
    <div class="header-marquee">
      <marquee behavior="" direction="left">
        <h2>OOU LOST & FOUND MANAGEMENT SYSTEM</h2>
      </marquee>
    </div>
    <div class="right-handside">
      <i class="fa-solid fa-bell"></i>
      <i class="fa-solid fa-cog"></i>
    </div>
  </header>


  <div class="body-container">
    <div class="search-top">
      <input type="search" id="searchInput" placeholder="Search by category, date or location">
      <select id="categoryFilter">
        <option value="">All Categories</option>
        <option value="books">Books</option>
        <option value="card">Card</option>
        <option value="electronics">Electronics</option>
      </select>
      <button id="searchBtn">Search</button>
    </div>

    <div class="items-box" id="itemsContainer"></div>

    <div id="proofModal" class="modal">
      <div class="modal-content">
        <span class="close" onclick="closeModal()">&times;</span>
        <h2>Submit Proof of Ownership</h2>
        <p>Please provide valid details to verify this item.</p>

        <form id="proofForm">
          <input type="hidden" id="modalItemId">
          
          <label for="proofDescription">Item Description</label>
          <textarea id="proofDescription" placeholder="Describe unique features of the item" required></textarea>

          <label for="proofFile">Proof (Upload Image/Receipt)</label>
          <input type="file" id="proofFile" required>

          <label for="proofAdditional">Additional Information</label>
          <textarea id="proofAdditional" placeholder="Any extra details"></textarea>

          <button type="submit" class="submit-btn">Submit Proof</button>
        </form>
      </div>
    </div>

    <div id="overlay" class="overlay" onclick="closeSheet()"></div>

    <div id="bottomSheet" class="bottom-sheet">
      <div class="sheet-header">
        <h2>Item Details</h2>
        <span onclick="closeSheet()" class="close-btn">&times;</span>
      </div>
      <div class="sheet-content" id="sheetDetailsContent">
        </div>
    </div>
</div>












  <div class="bottom-nav">
    <a href="./dashboard.html" class="nav-item">
      <i class="fa fa-home"></i>
      <span>Dashboard</span>
    </a>

    <a href="./view-lost.html" class="nav-item ">
      <i class="fa fa-search"></i>
      <span>Lost</span>
    </a>

    <a href="./report.html" class="nav-item">
      <i class="fa fa-plus-circle"></i>
      <span>Report</span>
    </a>
    <a href="./view-found.html" class="nav-item active">
      <i class="fa fa-eye"></i>
      <span>Found</span>
    </a>

  </div>
  <script src="../script/faq.js"></script>
  <script src="../script/proof.js"></script>
  <script src="../script/bottom-modal.js"></script>
  <script src="../script/viewFoundItems.js"></script>


</body>

</html>
