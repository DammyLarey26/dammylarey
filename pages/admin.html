<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Panel</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <link rel="stylesheet" href="../css/new-admin.css">
</head>

<body>
    <header class="header">
        <h3>ADMIN DASHBOARD</h3>
    </header>
    
    <div class="sidebar">
      <div class="logo">
        <img src="../images/download.png" alt="">
      </div>
        <h3>Admin Options</h3>
        <nav-bar>
          <div class="options">
            <a href="./user-management.html"><i class="fas fa-users"></i> Users</a>

<a href="./admin-items.html"><i class="fas fa-box"></i> Items</a>

<a href="./admin-verify.html"><i class="fas fa-check-circle"></i> Verify Claims</a>

<a href="#" id="logout"><i class="fas fa-sign-out-alt"></i> Logout</a>

<button><i class="fas fa-file-pdf"></i> Generate Report</button>
          </div> 
        </nav-bar>
    </div>
      <section class="admin-top">
        <span>Welcome,Admin!</span>
        <span>Accessble only to system admnistrators</span>
      </section>

      <section class="det-top">
    <h3>Overview</h3>
    <div class="overview-box">
        <div class="box">
            <span id="countUsers">0</span>
            <span>Users</span>
        </div>

        <div class="box">
            <span id="countLost">0</span>
            <span>Items</span>
        </div>


        <div class="box">
            <span id="countPending">0</span>
            <span>Claims</span>
        </div>
    </div>

    <h3>Recently Reported</h3>
    <div class="recenty-reported">
        <button class="view-btn" onclick="window.location.href='./admin-items.html'">View All</button>
        
        <!-- 🛒 Dynamic target element where recent rows load -->
        <div id="recentItemsContainer">
            <p style="padding: 15px; color: #666; font-size: 14px;">Loading real-time portal statistics...</p>
        </div>
    </div>
</section>
      

 

<script>
document.getElementById("logout").addEventListener("click", function (e) {
    e.preventDefault();

    if (confirm("Are you sure you want to logout?")) {

        sessionStorage.clear();

        alert("Logged out successfully.");

        window.location.replace("admin-log.html");
    }
});
</script>
  <script src="script/script.js" type="module"></script>
  <script>
history.pushState(null, null, location.href);

window.onpopstate = function () {
    history.go(1);
};
</script>
<script src="../script/admin-dashboard.js"></script>
<script src="../script/admin-session.js"></script>
</body>

</html>
