<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <link rel="stylesheet" href="../css/findings.css">
  <link rel="stylesheet" href="../css/view.css">
  <link rel="stylesheet" href="../css/style.css">
  <link rel="stylesheet" href="../css/bottommodal.css">

</head>

<body>
  <div class="header">
    <div class="logo"><button class="backbtn" onclick="history.back()">&#8592</button></div>
    <div class="nav-bar" id="navBar">
		<button class="close-btn" id="closeBtn">&times;</button>
        <a href="../index.html">Home</a>
        <a class="active" href="">Lost & Found Listings</a>
        <a href="./features.html">Features</a>
        <a href="./contact.html">Contact Us</a>
        <a href="./login.html">SIGN IN/UP</a>
    </div><button class="menu-btn" id="menuBtn">☰</button>
</div>
  <div class="body-container">
    <div class="search-top">
  <!-- Added an ID here for reliable script targeting -->
  <input type="search" id="dashboardSearch" placeholder="Search by category, date or location">
  
  <!-- Added values to options so the script can filter cleanly -->
  <select id="dashboardCategoryFilter">
    <option value="all">All Categories</option>
    <option value="books">Books</option>
    <option value="card">Card</option>
    <option value="electronics">Electronics</option>
  </select>
  <button id="dashboardSearchBtn">Search</button>
</div>
    
    <div class="items-box-wrapper">
    <!-- 🛒 The Live Feed Container -->
    <div class="items-box" id="lostItemsContainer">
        <p style="text-align: center; width: 100%; color: #666; padding: 20px;">Fetching lost items from portal database...</p>
    </div>

    <!-- Backdrop Overlay -->
    <div id="overlay" class="overlay" onclick="closeSheet()"></div>
</div>

<!-- 🙋‍♂️ Injected Claim / Request Proof Modal Structure -->
<div id="proofModal" class="modal" style="display: none;">
  <div class="modal-content">
    <span class="close" onclick="closeModal()">&times;</span>
    <h2>Submit Proof of Ownership</h2>
    <p>Please provide valid details to verify this item.</p>

    <form id="proofForm">
      <input type="hidden" id="modalItemId">
      
      <label for="proofDescription">Item Description</label>
      <textarea id="proofDescription" placeholder="Describe unique features of the item" required></textarea>

      <label for="proofFile">Proof (Upload Image/Receipt)</label>
      <input type="file" id="proofFile" required>

      <label for="proofAdditional">Additional Information</label>
      <textarea id="proofAdditional" placeholder="Any extra details"></textarea>

      <button type="submit" class="submit-btn">Submit Proof</button>
    </form>
  </div>
</div>

<!-- 📦 Dynamic Bottom Sheet -->
<div id="bottomSheet" class="bottom-sheet">
    <div class="sheet-header">
        <h2>Item Details</h2>
        <span onclick="closeSheet()" class="close-btn">&times;</span>
    </div>

    <div class="sheet-content">
        <div class="sheet-content-par">
            <p>Item name:</p>
            <p id="sheetItemName">---</p>
        </div>

        <div class="sheet-content-par">
            <p>Categories:</p>
            <p id="sheetCategory">---</p>
        </div>

        <div class="sheet-content-par">
            <p>Date Found:</p>
            <p id="sheetDate">---</p>
        </div>

        <div class="sheet-content-par">
            <p>Location Found:</p>
            <p id="sheetLocation">---</p>
        </div>

        <div class="sheet-content-par">
            <p>Item description:</p>
            <p id="sheetDescription">---</p>
        </div>
    </div>
</div></div></main>
  
  </section>
  <script src="../script/toggle.js"></script>
  <script src="../script/bottom-modal.js"></script>
  <script src="../script/ham.js"></script>
  <script src="../script/findings.js"></script>
</body>

</html>
