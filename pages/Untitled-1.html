<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="../css/Untitled-1.css">
</head>
<body>
    <header class="navbar">
  <div class="logo">Lost & Found</div>
  
  <button class="hamburger" id="hamburger-btn" aria-label="Toggle navigation">
    <span class="bar"></span>
    <span class="bar"></span>
    <span class="bar"></span>
  </button>
  
  <nav class="nav-menu" id="nav-menu">
    <a href="#">Home</a>
    <a href="#">Lost & Found Listings</a>
    <a href="#">Features</a>
    <a href="#">Contact Us</a>
    <a href="#" class="nav-cta">SIGN IN/UP</a>
  </nav>
</header>

<script>
    const hamburger = document.getElementById('hamburger-btn');
const navMenu = document.getElementById('nav-menu');

hamburger.addEventListener('click', () => {
  // Toggle the 'active' class on the menu
  navMenu.classList.toggle('active');
  
  // Optional: Add an active class to animate the hamburger into an 'X'
  hamburger.classList.toggle('is-active');
});
</script>
</body>
</html>
