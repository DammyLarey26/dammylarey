<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Approved Items</title>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <!-- Link to external CSS stylesheet -->
    <link rel="stylesheet" href="../css/my-claims.css">
</head>
<body>

<div class="container">

    <div class="page-header">
        <div>
            <h1>Approved Items</h1>
            <p>Successfully verified and released items.</p>
        </div>
    </div>

    <!-- Statistics Dashboard Panels Area -->
    <div class="stats">
        <div class="stat-card pending">
            <i class="fas fa-clock"></i>
            <h2>--</h2>
            <span>Pending Approvals</span>
        </div>
        <div class="stat-card approved">
            <i class="fas fa-check-circle"></i>
            <h2>--</h2>
            <span>Approved Items</span>
        </div>
        <div class="stat-card rejected">
            <i class="fas fa-times-circle"></i>
            <h2>--</h2>
            <span>Rejected Claims</span>
        </div>
    </div>

    <!-- Filter Control Toolbar -->
    <div class="toolbar">
        <div class="search-box">
            <i class="fas fa-search"></i>
            <input type="text" id="searchInput" placeholder="Search approved items...">
        </div>
    </div>

    <!-- Uniform Compact Grid Layout -->
    <div class="claims-grid" id="itemsContainer">
        <!-- Loader / Fallback Elements inside the grid -->
        <div id="loadingStatus">Loading items from portal...</div>
        <div id="statusMessage" style="display: none;"></div>
    </div>

</div>

<!-- Details Modal Popup -->
<div class="modal" id="modal">
    <div class="modal-content">
        <span class="close" id="closeModalBtn">&times;</span>
        <img id="mImage" src="" alt="Item Image">
        <h2 id="mTitle"></h2>

        <p><strong>Category:</strong> <span id="mCategory"></span></p>
        <p><strong>Location Found:</strong> <span id="mLocation"></span></p>
        <p><strong>Date Found:</strong> <span id="mDateFound"></span></p>
        <p><strong>Description:</strong></p>
        <p id="mDescription"></p>

        <hr class="modal-divider">
        <h4>Founder Details</h4>
        <p><strong>Name:</strong> <span id="mFinder"></span></p>
        <p><strong>Matric No:</strong> <span id="mFinderId"></span></p>

        <hr class="modal-divider">
        <h4>Approval Information</h4>
        <p><strong>Date Approved:</strong> <span id="mApproveDate"></span></p>
        <p><strong>Time Approved:</strong> <span id="mApproveTime"></span></p>

        <button id="modalCloseBtn" class="view">Close</button>
    </div>
</div>

<!-- Link to external JavaScript file -->
<script src="../script/claimed-items.js"></script>
</body>
</html>
