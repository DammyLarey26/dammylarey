<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registration Page</title>

    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/reg.css">
</head>
<body>
    <section class="cont-reg">
        <div class="cont-main">
            <div class="header-cont">
                <h1>REGISTRATION PAGE</h1>
                <p>Please fill in the remaining information to complete your registration</p>
            </div>

            <form class="body-cont form">
                <div class="passport-photo">
                    <p>Upload Passport</p>
                    <input type="file" class="passport-input" required>
                </div>

                <div class="container">
                    <label>
                        Username *
                        <input class="input-form" type="text" required>
                    </label>
                    
                    <label>
                        Faculty *
                        <select required>
                            <option value="" disabled selected>Select Faculty</option>
                            <option value="">Science</option>
                            <option value="">Engineering</option>
                            <option value="">Agriculture</option>
                            <option value="">Education</option>
                        </select>                    
                    </label>

                    <label>
                        Department *
                        <select required>
                            <option value="">Computer Science</option>
                            <option value="">Microbiology</option>
                            <option value="">Mathematics</option>
                            <option value="">Statistic</option>
                            <option value="">Chemistry</option>
                        </select>
                    </label>

                    <label>
                        Gender *
                        <div class="radio-group">
                            <input type="radio" name="gender" value="male">Male
                            <input type="radio" name="gender" value="female"> Female
                        </div>
                    </label>
                </div>

                <div class="container">
                    <label>
                        Matric No. / Staff ID *
                        <input class="input-form" type="text" required>
                    </label>

                    <label>
                        Level *
                        <select required>
                            <option value="" disabled selected>Select Level</option>
                            <option value="100">100 Level</option>
                            <option value="200">200 Level</option>
                            <option value="300">300 Level</option>
                            <option value="400">400 Level</option>
                            <option value="500">500 Level</option>
                            <option value="staff">Staff</option>
                        </select>
                    </label>

                    <label>
                        Address *
                        <input class="input-form" type="text" required>
                    </label>

                    <label>
                        Email *
                        <input class="input-form" type="email" disabled>
                    </label>

                    <label>
                        Phone Number *
                        <input class="input-form" type="tel" required>
                    </label>
                </div>

            </form>

            <button class="reg-btn" type="submit">Register</button>

        </div>
    </main>
    <script src="../script/c-reg.js"></script>
</body>
</html>
