<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Report Lost</title>
  <link rel="stylesheet" href="../css/style.css">
  <link rel="stylesheet" href="../css/reg.css">
  <link rel="stylesheet" href="../css/upload.css">
</head>

<body>
  <header class="header">
    <button class="backbtn" onclick="history.back()">&#8592</button>
    <div class="header-marquee">
      <marquee behavior="" direction="left">
        <h2>OOU LOST & FOUND MANAGEMENT SYSTEM</h2>
      </marquee>
    </div>
  </header>
  </header>

  <section class="cont-reg">
    <div class="cont-main">
      <div class="header-cont">
        <h2>REGISTRATION PAGE</h2>
      </div>

      <div class="body-cont">
        <div class="container">
          <label>
            Fullname *
            <input class="input-form" id="name" type="text" required>
          </label>

          <label>
            Faculty *
            <select id="faculty" required>
              <option value="" disabled selected>Select Faculty</option>
              <option value="science">Science</option>
              <option value="engineer">Engineering</option>
              <option value="agriculture">Agriculture</option>
              <option value="education">Education</option>
            </select>
          </label>

          <label>
            Department *
            <select id="department" required>
              <option value="" disabled selected>Select Department</option>
              <option value="computer science">Computer Science</option>
              <option value="micriobiology">Microbiology</option>
              <option value="mathematics">Mathematics</option>
              <option value="statistics">Statistic</option>
              <option value="chemistry">Chemistry</option>
            </select>
          </label>

          <label>
            Gender *
            <div class="radio-group">
              <input type="radio" name="gender" value="male"> Male
              <input type="radio" name="gender" value="female"> Female
              <input type="radio" name="gender" value="trans"> Trans
            </div>
          </label>

          <label>
            Passport *
            <div class="upload-container">
              <label for="fileInput" class="pass" id="uploadBox">
                <input type="file" id="fileInput" accept="image/*" hidden>

                <div class="upload-content" id="uploadContent">
                  <div class="plus">+</div>
                  <p class="subtitle">passport</p>
                </div>

                <img id="previewImage" class="preview" />
              </label>
            </div>

        </div>
        <div class="container">
          <label>
            Matric No. / Staff ID *
            <input class="input-form" id="matric" type="text" required>
          </label>

          <label>
            Level *
            <select id="level" required>
              <option value="" disabled selected>Select Level</option>
              <option value="100">100 Level</option>
              <option value="200">200 Level</option>
              <option value="300">300 Level</option>
              <option value="400">400 Level</option>
              <option value="500">500 Level</option>
              <option value="staff">Staff</option>
            </select>
          </label>

          <label>
            Address *
            <input class="input-form" id="address" type="text" required>
          </label>

          <label>
            Email *
            <input class="input-form" id="email" type="email">
          </label>

          <label>
            Phone Number *
            <input class="input-form" id="phone" type="tel" required>
          </label>

          <label>
            Password *
            <input class="input-form" id="password" type="password" required>
          </label>
        </div>

      </div>
      <button class="submit" id="signupBtn">Register</button>
    </div>
  </section>

  <script src="../script/signup.js" type="module"></script>
</body>

</html>
