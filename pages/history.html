<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>History - Lost & Found</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">  
    <link rel="stylesheet" href="../css/prof.css">
</head>

<body>
    <!-- Top Navigation Header -->
    <header class="user-header">
        <button class="menu-btn" id="menuBtn">
            <i class="fa-solid fa-bars"></i>
        </button>

        <div class="marquee">
            <marquee direction="left">
                <h2>History - Lost & Found</h2>
            </marquee>
        </div>
    </header>

    <!-- Sidebar Drawer System -->
    <div class="sidebar" id="sidebar">
        <button class="close-btn" id="closeBtn">&times;</button>
        <button class="backbtn" onclick="history.back()">&#8592;</button>

        <div class="user-options">
            <div class="dash-logo">
                <img src="../images/download.png" alt="Dashboard Logo">
            </div>

            <nav>
                <a href="../index.html">Home</a>
                <a href="./profile.html">Profile</a>
                <a href="./dashboard.html">Dashboard</a>
            </nav>
        </div>
    </div>

    <!-- Main Application Content -->
    <main class="main-content">
        
        <!-- Page Header -->
        <div class="page-header history-header">
            <div>
                <h1>Your History</h1>
                <p>View and monitor all the items you have reported to the Lost & Found system.</p>
            </div>
        </div>

        <!-- Filter & Search Toolbar -->
        <div class="toolbar">
            <div class="search-box" style="flex: 2;">
                <i class="fa-solid fa-search"></i>
                <input 
                    type="text" 
                    id="searchBar" 
                    placeholder="Search by item name, location or description...">
            </div>

            <select id="statusFilter" style="flex: 1;">
                <option value="all">All Status</option>
                <option value="pending">Pending</option>
                <option value="approved">Approved</option>
                <option value="found">Found</option>
                <option value="claimed">Claimed</option>
                <option value="returned">Returned</option>
                <option value="rejected">Rejected</option>
                <option value="closed">Closed</option>
            </select>
        </div>

        <!-- Dynamic Items Grid Container -->
        <div id="historyCardsContainer" class="claims-grid">
            <!-- JavaScript will inject .claim-card items here -->
        </div>

    </main>

    <!-- Application Scripts -->
    <script type="module" src="../script/history.js"></script>
    <script src="../script/faq.js"></script>
    <script src="../script/dashboard.js"></script>

    <!-- Sidebar UI Controller -->
    <script>
        const sidebar = document.getElementById("sidebar");
        const menuBtn = document.getElementById("menuBtn");
        const closeBtn = document.getElementById("closeBtn");

        menuBtn.addEventListener("click", () => {
            sidebar.classList.add("active");
        });

        closeBtn.addEventListener("click", () => {
            sidebar.classList.remove("active");
        });
    </script>
    <script src="../script/session.js"></script>
</body>
</html>
