<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Continue Registration</title>

    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/profile.css">
    <link rel="stylesheet" href="../css/cont.css">
</head>
<body>

    <div class="header">
        <div class="logo">
            <img src="../images/download.jpeg" alt="OOU Logo">
            <a href="#">Home</a>
            <a href="#">Lost & Found Listings</a>
            <a href="#">Contact Us</a>
        </div>
    </div>

    <main class="cont-reg">
        <div class="cont-main">

            <div class="header-cont">
                <h1>CONTINUE REGISTRATION</h1>
                <p>Please fill in the remaining information to complete your registration</p>
            </div>

            <form class="body-cont">

                <div class="passport pass2">
                    <input type="file">
                    <p>Upload Passport</p>
                </div>

                <div class="container">
                    <label>
                        Full Name *
                        <input class="input-form name" type="text" required>
                    </label>

                    <label>
                        Department *
                        <input class="input-form department" type="text" required>
                    </label>

                    <label>
                        Gender *
                        <div class="radio-group">
                            <input type="radio" name="gender" value="male" class="radii"> 
                            Male
                            <input type="radio" name="gender" value="female" class="radii"> Female
                        </div>
                    </label>
                </div>

                <div class="container">
                    <label>
                        Matric No. / Staff ID *
                        <input class="input-form matric" type="text" required>
                    </label>

                    <label>
                        Level *
                        <select required class="level">
                            <option value="" disabled selected>Select Level</option>
                            <option value="100">100 Level</option>
                            <option value="200">200 Level</option>
                            <option value="300">300 Level</option>
                            <option value="400">400 Level</option>
                            <option value="500">500 Level</option>
                            <option value="staff">Staff</option>
                        </select>
                    </label>

                    <label>
                        Address *
                        <input class="input-form address" type="text" required>
                    </label>

                    <label>
                        Email *
                        <input class="input-form email" type="email" disabled>
                    </label>

                    <label>
                        Phone Number *
                        <input class="input-form phone" type="tel" required>
                    </label>
                </div>

            </form>

            <button class="submit">Complete Registration</button>

        </div>
    </main>
    <script src="/script/c-reg.js"></script>
</body>
</html>
