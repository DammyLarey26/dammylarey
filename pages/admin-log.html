<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login</title>

    <style>
        .toast{
            position:fixed;
            top:20px;
            right:20px;
            min-width:280px;
            padding:15px 20px;
            border-radius:8px;
            color:#fff;
            font-family:Arial, Helvetica, sans-serif;
            font-size:15px;
            box-shadow:0 10px 25px rgba(0,0,0,.25);
            transform:translateX(120%);
            transition:.4s;
            z-index:9999;
        }

        .toast.show{
            transform:translateX(0);
        }

        .toast.success{
            background:#28a745;
        }

        .toast.error{
            background:#dc3545;
        }
    </style>
</head>

<body style="background-color:beige;margin:0;padding:200px;">

<div style="width:fit-content;background-color:rgb(117,25,25);padding:20px;margin:auto;">

    <div style="display:block;margin-bottom:20px;">

        <input
            style="margin-bottom:20px;display:flex;padding:10px;text-align:center;border-radius:20px;border:none;"
            type="text"
            id="username"
            placeholder="Username">

        <input
            style="padding:10px;text-align:center;border-radius:20px;border:none;"
            type="password"
            id="password"
            placeholder="Password">

    </div>

    <button
        id="loginBtn"
        style="cursor:pointer;padding:10px;color:rgb(117,25,25);background:beige;border:none;">
        Login
    </button>

</div>

<div id="toast" class="toast"></div>

<script>

sessionStorage.clear();

const loginBtn = document.getElementById("loginBtn");

loginBtn.addEventListener("click", loginAdmin);

document.addEventListener("keydown", function(e){
    if(e.key==="Enter"){
        loginAdmin();
    }
});

function showToast(message,type){

    const toast=document.getElementById("toast");

    toast.textContent=message;
    toast.className="toast "+type+" show";

    setTimeout(()=>{
        toast.classList.remove("show");
    },2000);

}

function loginAdmin(){

    const username=document.getElementById("username").value.trim();
    const password=document.getElementById("password").value.trim();

    if(username==="admin" && password==="12345"){

        sessionStorage.setItem("adminLoggedIn","true");
        sessionStorage.setItem("adminUsername",username);
        sessionStorage.setItem("adminLoginTime",Date.now());
        sessionStorage.setItem("adminLastActivity",Date.now());

        loginBtn.disabled=true;
        loginBtn.textContent="Logging in...";

        showToast("✅ Login Successful! Redirecting...","success");

        setTimeout(()=>{
            window.location.replace("admin.html");
        },2000);

    }else{

        showToast("❌ Invalid username or password.","error");

    }

}

</script>

</body>
</html>
