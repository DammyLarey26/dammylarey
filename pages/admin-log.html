<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login</title>
</head>
<body>

    <div style="width: fit-content; background-color: brown; padding: 20px; gap: 10px; margin: auto;">
        <div style="display: block;">
        <input style="margin-bottom: 20px; display: flex; padding: 10px;text-align: center;border-radius: 20px;border: none;" type="text" id="username" placeholder="username">
        <input style="padding: 10px;text-align: center;border-radius: 20px;border: none;" type="password" id="password" placeholder="password">
        <button style="padding: 10px; color: brown; background-color: beige; border: none;" id="loginBtn">Login</button>
        </div>
    </div>

    <script>
        const loginBtn = document.getElementById('loginBtn');

        loginBtn.addEventListener('click', () => {
            const username = document.getElementById('username').value.trim();
            const password = document.getElementById('password').value.trim();

            if (username === 'admin' && password === '12345') {
                window.location.href = 'admin.html';
            } else {alert('Invalid username or password');
            }
        });
    </script>

</body>
</html>
