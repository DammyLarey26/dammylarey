<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lost Items</title>
    <!-- Icons Libraries -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
    <!-- Master Shared Layout CSS Files -->
    <link rel="stylesheet" href="../css/prof.css">
    <link rel="stylesheet" href="../css/view.css">
</head>

<body>
    <!-- Main Top Layout Bar Header Structure -->
    <header class="user-header">
        <button class="menu-btn" id="menuBtn">☰</button>
        <div class="marquee">
            <marquee behavior="" direction="left">
                <h2>Found Items</h2>
            </marquee>
        </div>
    </header>

    <!-- Navigation Drawer Sidebar Panel Layout -->
    <div class="sidebar" id="sidebar">
        <button class="close-btn" id="closeBtn">&times;</button>
        <button class="backbtn" onclick="history.back()">&#8592;</button>
        <div class="user-options">
            <div class="dash-logo">
                <img src="../images/download.png" alt="Logo">
            </div>
            <a href="../index.html">Home</a>
            <a href="">Profile</a>
            <a href="./dashboard.html">Dashboard</a>
        </div>
        
    </div>

    <!-- Core App Interface Main Body Content Frame Grid Container Wrapper -->
    <main class="main-content">
        <div class="body-container">
            
            <div class="search-top">
                <!-- Text Search input -->
                <input type="search" id="dashboardSearch" placeholder="Search items...">
            </div>
            
            <div class="items-box-wrapper">
                <!-- 🛒 The Live Feed Container -->
                <div class="items-box" id="lostItemsContainer">
                    <p style="text-align: center; width: 100%; color: #666; padding: 20px;">Fetching lost items from portal database...</p>
                </div>

                <!-- Backdrop Overlay -->
                <div id="overlay" class="overlay" onclick="closeSheet()"></div>
            </div>

            <!-- 🙋‍♂️ Injected Claim / Request Proof Modal Structure -->
            <div id="proofModal" class="modal" style="display: none;">
                <div class="modal-content">
                    <span class="close" onclick="closeModal()">&times;</span>
                    <h2>Submit Proof of Ownership</h2>
                    <p>Please provide valid details to verify this item.</p>

                    <form id="proofForm">
                        <input type="hidden" id="modalItemId">
                        
                        <label for="proofDescription">Item Description</label>
                        <textarea id="proofDescription" placeholder="Describe unique features of the item" required></textarea>

                        <label for="proofFile">Proof (Upload Image/Receipt)</label>
                        <input type="file" id="proofFile" accept="image/*" required>

                        <label for="proofAdditional">Additional Information</label>
                        <textarea id="proofAdditional" placeholder="Any extra details"></textarea>

                        <button type="submit" class="submit-btn">Submit Proof</button>
                    </form>
                </div>
            </div>

            <!-- 📦 Dynamic Bottom Sheet -->
            <div id="bottomSheet" class="bottom-sheet">
                <div class="sheet-header">
                    <h2>Item Details</h2>
                    <span onclick="closeSheet()" class="close-btn">&times;</span>
                </div>

                <div class="sheet-content">
                    <div class="sheet-content-par">
                        <p>Item name:</p>
                        <p id="sheetItemName">---</p>
                    </div>

                    <div class="sheet-content-par">
                        <p>Categories:</p>
                        <p id="sheetCategory">---</p>
                    </div>

                    <div class="sheet-content-par">
                        <p>Date Found:</p>
                        <p id="sheetDate">---</p>
                    </div>

                    <div class="sheet-content-par">
                        <p>Location Found:</p>
                        <p id="sheetLocation">---</p>
                    </div>

                    <div class="sheet-content-par">
                        <p>Item description:</p>
                        <p id="sheetDescription">---</p>
                    </div>
                </div>
            </div>

        </div>
    </main>

    <!-- Script Subsystem Drivers Injection Pipeline Execution Binding Configuration Sequence -->
    <script src="../script/faq.js"></script>
    <script src="../script/upload.js"></script>
    <script src="../script/bottom-modal.js"></script>
    <script src="../script/lost-items.js"></script>
    <script>
        // Inline UI Event Sidebar Action Bindings Integration Hook Configuration Layout Block
        const sidebar = document.getElementById("sidebar");
        const menuBtn = document.getElementById("menuBtn");
        const closeBtn = document.getElementById("closeBtn");

        menuBtn.addEventListener("click", () => {
            sidebar.classList.add("active");
        });

        closeBtn.addEventListener("click", () => {
            sidebar.classList.remove("active");
        });
    </script>
</body>

</html>
