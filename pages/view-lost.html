<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lost Items</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/user.css">
    <link rel="stylesheet" href="../css/view.css">
</head>
<body>

    <header class="header">
        <div class="header-marquee">
            <marquee behavior="" direction="left">
                <h2>OOU LOST & FOUND MANAGEMENT SYSTEM</h2>
            </marquee>
        </div>
        <div class="right-handside">
        <i class="fa-solid fa-bell"></i>
        <i class="fa-solid fa-cog"></i> 
        </div>          
    </header>


    <div class="body-container">
        <div class="search-top">
            <input type="search" placeholder="Search by category,date or location">
            <select>
                <option value="">All Categories</option>
                <option value="">Books</option>
                <option value="">Card</option>
                <option value="">Electronics</option>
            </select>
            <button>Search</button>
        </div>    
        <div class="items-box">
            <div class="items-box-item">
                <div class="items-details">
                    <div class="item-img">
                        <img src="../images/Laptop.png" alt="">
                    </div>
                    <div class="items-det">
                    <h2>Hp Laptop</h2>
                    <span>Damilare O.</span>
                    <span>Library. 26 April 2026</span>
                    </div>                
                </div>
                <div class="status">
                <p>Available </p>
                </div>
                <button>View Details</button>
            </div>
        </div>
         <div class="items-box-item">
                <div class="items-details">
                    <div class="item-img">
                        <img src="../images/Laptop.png" alt="">
                    </div>
                    <div class="items-det">
                    <h2>Hp Laptop</h2>
                    <span>Damilare O.</span>
                    <span>Library. 26 April 2026</span>
                    </div>                
                </div>
                <div class="status claimed">
                <p>Claimed </p>
                </div>
                <button>View Details</button>
            </div>               
    </div>
